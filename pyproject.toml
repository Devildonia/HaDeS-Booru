[project]
name = "hades-booru"
version = "1.0.4"
description = "Universal Booru Prompt Harvester, Tag Normalizer & LoRA Dataset Builder (Python + Gradio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HaDeS (DeViLDoNia)", email = "devildonia@gmail.com" }]
dependencies = [
    "gradio>=6.0,<7",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
